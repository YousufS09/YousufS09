<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed Yousuf's AI application pipeline</title>
  <desc id="desc">An animated flow from user interface to API, retrieval, LLM reasoning and data persistence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#111a2b"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="240" rx="18" fill="url(#background)" stroke="#30363d"/>
  <rect x="1" y="1" width="898" height="238" rx="18" fill="url(#grid)" opacity="0.45"/>
  <text x="450" y="38" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="2">HOW I SHIP AI-POWERED PRODUCTS</text>
  <path d="M110 126H790" stroke="#30363d" stroke-width="5" stroke-linecap="round"/>
  <path d="M110 126H790" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 14">
    <animate attributeName="stroke-dashoffset" from="52" to="0" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(110 126)">
      <circle r="44" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <circle r="48" fill="none" stroke="#58a6ff" opacity="0.25"><animate attributeName="r" values="45;53;45" dur="3s" repeatCount="indefinite"/></circle>
      <text y="-3" fill="#f0f6fc" font-size="14" font-weight="600">INTERFACE</text><text y="16" fill="#8b949e" font-size="11">React.js</text>
    </g>
    <g transform="translate(280 126)">
      <circle r="44" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
      <circle r="48" fill="none" stroke="#79c0ff" opacity="0.25"><animate attributeName="r" values="45;53;45" dur="3s" begin=".5s" repeatCount="indefinite"/></circle>
      <text y="-3" fill="#f0f6fc" font-size="14" font-weight="600">API</text><text y="16" fill="#8b949e" font-size="11">Node + Express</text>
    </g>
    <g transform="translate(450 126)">
      <circle r="44" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
      <circle r="48" fill="none" stroke="#a371f7" opacity="0.25"><animate attributeName="r" values="45;53;45" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
      <text y="-3" fill="#f0f6fc" font-size="14" font-weight="600">RETRIEVE</text><text y="16" fill="#8b949e" font-size="11">RAG context</text>
    </g>
    <g transform="translate(620 126)">
      <circle r="44" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
      <circle r="48" fill="none" stroke="#d2a8ff" opacity="0.25"><animate attributeName="r" values="45;53;45" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
      <text y="-3" fill="#f0f6fc" font-size="14" font-weight="600">REASON</text><text y="16" fill="#8b949e" font-size="11">LLMs + Agents</text>
    </g>
    <g transform="translate(790 126)">
      <circle r="44" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <circle r="48" fill="none" stroke="#3fb950" opacity="0.25"><animate attributeName="r" values="45;53;45" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
      <text y="-3" fill="#f0f6fc" font-size="14" font-weight="600">PERSIST</text><text y="16" fill="#8b949e" font-size="11">PostgreSQL</text>
    </g>
  </g>
  <circle r="6" fill="#ffffff" filter="url(#glow)">
    <animateMotion path="M110 126H790" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="212" text-anchor="middle" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="12">Intuitive interfaces  ·  Secure services  ·  Grounded AI  ·  Reliable data</text>
</svg>
