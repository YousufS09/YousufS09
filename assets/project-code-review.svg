<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Code Review AI Agent: An autonomous reviewer that reads every pull request and responds with precise, actionable findings.">
  <defs>
    <linearGradient id="bgcr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <linearGradient id="glcr" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <clipPath id="cpcr"><rect x="0.5" y="0.5" width="899" height="249" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#cpcr)" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">
    <rect width="900" height="250" fill="url(#bgcr)"/>
    <rect width="900" height="4" fill="#a371f7"/>
    <rect y="0" width="120" height="4" fill="url(#glcr)"><animate attributeName="x" from="-120" to="900" dur="3.5s" repeatCount="indefinite"/></rect>
    <text x="32" y="50" font-size="22" font-weight="700" fill="#f0f6fc">Code Review AI Agent</text>
    <rect x="798" y="30" width="78" height="22" rx="11" fill="none" stroke="#a371f7"/>
    <text x="837.0" y="45" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#a371f7">AI AGENT</text>
    <text x="32" y="78" font-size="13.5" fill="#8b949e">An autonomous reviewer that reads every pull request</text><text x="32" y="98" font-size="13.5" fill="#8b949e">and responds with precise, actionable findings.</text>
    <g>
      <rect x="560" y="70" width="310" height="150" rx="10" fill="#0d1117" stroke="#30363d"/>
      <rect x="594" y="86" width="150" height="7" rx="3.5" fill="#58a6ff" opacity=".55"/><text x="574" y="93" font-family="Consolas,'SF Mono',Menlo,'Courier New',monospace" font-size="9" fill="#8b949e">1</text><rect x="594" y="103" width="210" height="7" rx="3.5" fill="#8b949e" opacity=".55"/><text x="574" y="110" font-family="Consolas,'SF Mono',Menlo,'Courier New',monospace" font-size="9" fill="#8b949e">2</text><rect x="594" y="120" width="120" height="7" rx="3.5" fill="#3fb950" opacity=".55"/><text x="574" y="127" font-family="Consolas,'SF Mono',Menlo,'Courier New',monospace" font-size="9" fill="#8b949e">3</text><rect x="594" y="137" width="240" height="7" rx="3.5" fill="#8b949e" opacity=".55"/><text x="574" y="144" font-family="Consolas,'SF Mono',Menlo,'Courier New',monospace" font-size="9" fill="#8b949e">4</text><rect x="594" y="154" width="180" height="7" rx="3.5" fill="#f0883e" opacity=".55"/><text x="574" y="161" font-family="Consolas,'SF Mono',Menlo,'Courier New',monospace" font-size="9" fill="#8b949e">5</text><rect x="594" y="171" width="90" height="7" rx="3.5" fill="#8b949e" opacity=".55"/><text x="574" y="178" font-family="Consolas,'SF Mono',Menlo,'Courier New',monospace" font-size="9" fill="#8b949e">6</text><rect x="594" y="188" width="200" height="7" rx="3.5" fill="#58a6ff" opacity=".55"/><text x="574" y="195" font-family="Consolas,'SF Mono',Menlo,'Courier New',monospace" font-size="9" fill="#8b949e">7</text>
      <rect x="561" y="80" width="308" height="18" fill="#a371f7" opacity=".18">
        <animate attributeName="y" values="80;184;80" dur="4s" repeatCount="indefinite"/>
      </rect>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.55;.9;1" dur="4s" repeatCount="indefinite"/>
        <rect x="690" y="174" width="170" height="32" rx="8" fill="#a371f7"/>
        <text x="775" y="195" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">&#10003; Review posted to PR</text>
      </g>
    </g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="0.5s" fill="freeze"/><rect x="32" y="139" width="8" height="8" rx="2" fill="#a371f7"/><text x="48" y="148" font-size="13" fill="#f0f6fc">Verified GitHub App webhooks with rate limiting</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.75s" fill="freeze"/><rect x="32" y="160" width="8" height="8" rx="2" fill="#a371f7"/><text x="48" y="169" font-size="13" fill="#f0f6fc">Llama 3.3 70B analysis via the Groq API</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.0s" fill="freeze"/><rect x="32" y="181" width="8" height="8" rx="2" fill="#a371f7"/><text x="48" y="190" font-size="13" fill="#f0f6fc">Full review history persisted with Prisma</text></g>
    <rect x="32" y="210" width="66" height="22" rx="11" fill="#21262d" stroke="#30363d"/><text x="65.0" y="225" text-anchor="middle" font-size="11.5" fill="#a371f7" font-weight="600">Node.js</text><rect x="106" y="210" width="66" height="22" rx="11" fill="#21262d" stroke="#30363d"/><text x="139.0" y="225" text-anchor="middle" font-size="11.5" fill="#a371f7" font-weight="600">Express</text><rect x="180" y="210" width="86" height="22" rx="11" fill="#21262d" stroke="#30363d"/><text x="223.0" y="225" text-anchor="middle" font-size="11.5" fill="#a371f7" font-weight="600">PostgreSQL</text><rect x="274" y="210" width="59" height="22" rx="11" fill="#21262d" stroke="#30363d"/><text x="303.5" y="225" text-anchor="middle" font-size="11.5" fill="#a371f7" font-weight="600">Prisma</text><rect x="341" y="210" width="86" height="22" rx="11" fill="#21262d" stroke="#30363d"/><text x="384.0" y="225" text-anchor="middle" font-size="11.5" fill="#a371f7" font-weight="600">GitHub App</text><rect x="435" y="210" width="46" height="22" rx="11" fill="#21262d" stroke="#30363d"/><text x="458.0" y="225" text-anchor="middle" font-size="11.5" fill="#a371f7" font-weight="600">Groq</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="249" rx="14" fill="none" stroke="#30363d"/>
</svg>
