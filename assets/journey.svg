<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Journey: March 2026 AI/ML Intern at Kaaylabs; July 2026 Associate GenAI Engineer at Kaaylabs; next, building the next wave of AI products.">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <linearGradient id="tln" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#a371f7"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="229" rx="16" fill="url(#tbg)" stroke="#30363d"/>
  <g font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">
    <text x="450.0" y="36" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="2.5" fill="#8b949e">THE JOURNEY SO FAR</text>
    <path d="M180 118H720" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
    <path d="M180 118H720" stroke="url(#tln)" stroke-width="4" stroke-linecap="round" stroke-dasharray="540" stroke-dashoffset="540">
      <animate attributeName="stroke-dashoffset" from="540" to="0" begin="0.3s" dur="2.2s" fill="freeze"/>
    </path>
    <g opacity="0"><set attributeName="opacity" to="1" begin="0.3s" fill="freeze"/>
      <circle cx="180" cy="118" r="10" fill="#0d1117" stroke="#a371f7" stroke-width="3"/><circle cx="180" cy="118" r="4" fill="#a371f7"/>
      <text x="180" y="92" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#a371f7">MAR 2026</text>
      <text x="180" y="154" text-anchor="middle" font-size="13" fill="#f0f6fc">AI/ML Intern</text>
      <text x="180" y="172" text-anchor="middle" font-size="13" fill="#8b949e">at Kaaylabs</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.8s" fill="freeze"/>
      <circle cx="450" cy="118" r="10" fill="#0d1117" stroke="#db61a2" stroke-width="3"/><circle cx="450" cy="118" r="4" fill="#db61a2"/>
      <text x="450" y="92" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#db61a2">JUL 2026</text>
      <text x="450" y="154" text-anchor="middle" font-size="13" fill="#f0f6fc">Associate GenAI</text>
      <text x="450" y="172" text-anchor="middle" font-size="13" fill="#8b949e">Engineer, Kaaylabs</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.3s" fill="freeze"/>
      <circle cx="720" cy="118" r="10" fill="none" stroke="#3fb950" stroke-width="2"><animate attributeName="r" values="10;20;10" dur="2s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle><circle cx="720" cy="118" r="10" fill="#0d1117" stroke="#3fb950" stroke-width="3"/><circle cx="720" cy="118" r="4" fill="#3fb950"/>
      <text x="720" y="92" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#3fb950">NEXT</text>
      <text x="720" y="154" text-anchor="middle" font-size="13" fill="#f0f6fc">Building the next</text>
      <text x="720" y="172" text-anchor="middle" font-size="13" fill="#8b949e">wave of AI products</text></g>
  </g>
</svg>
